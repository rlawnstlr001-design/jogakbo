  <meta name="theme-color" content="#141B24" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="조각보 처음으로">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="17" height="12" fill="#2F5D7C"/><rect x="18" y="1" width="13" height="19" fill="#E2A93B"/>
        <rect x="1" y="13" width="9" height="18" fill="#B34A3C"/><rect x="10" y="13" width="8" height="18" fill="#7FA99B"/>
        <rect x="18" y="20" width="13" height="11" fill="#C9B75E"/>
        <rect x="1" y="1" width="30" height="30" fill="none" stroke="#F3EFE6" stroke-width="1.4" stroke-dasharray="2 1.6"/>
      </svg>
      <span class="brand-name">조각보</span>
    </a>
    <nav class="top-actions">
      <button class="icon-btn" id="btn-search" aria-label="검색">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>
      <button class="icon-btn" id="btn-tags" aria-label="태그 실타래">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M6 8c4 1 8 1 12 0M5 13c5 1.5 9 1.5 14 0M8 18c3 .5 5 .5 8 0"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      </button>
    </nav>
  </header>

  <nav class="tabs" aria-label="화면">
    <a href="#/" data-tab="list">조각들</a>
    <a href="#/today" data-tab="today">오늘의 조각<span class="dot" id="today-dot" hidden></span></a>
    <a href="#/bo" data-tab="bo">조각보</a>
  </nav>

  <div class="searchbar" id="searchbar" hidden>
    <input id="q" type="search" placeholder="조각 찾기" autocomplete="off" enterkeyhint="search">
    <button class="text-btn" id="q-close">닫기</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <footer class="composer" id="composer">
    <div class="quote" id="quote" hidden></div>
    <div class="suggest" id="suggest" hidden></div>
    <div class="compose-row">
      <textarea id="input" rows="1" placeholder="떠오른 것을 한 조각. #태그" aria-label="새 조각"></textarea>
      <button class="send" id="send" disabled aria-label="붙이기">붙이기</button>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>

  <script src="config.js?v=202610041032"></script>
  <script type="module" src="js/app.js?v=202610041032"></script>
</body>
</html>
